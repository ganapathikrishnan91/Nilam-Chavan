trigger:
  - main

pool:
  name: 'GANA_AZUREDEVOPS'

variables:
  - name: IMAGE_ID
    value: 'myapp:$(Build.BuildId)'

  - name: QSCANNER_OUTPUT_DIR
    value: '$(Build.ArtifactStagingDirectory)/qualys-reports'

  - name: QSCANNER_SCAN_TIMEOUT
    value: '10m'

  - name: QSCANNER_QUALYS_POD
    value: 'US1'

  - name: QSCANNER_POLICY_TAGS
    value: 'GANAQSCANNERPOLICY'
	
  - name: QUALYS_CLIENT_ID
    value: "dd024dc9-3977-4aa9-bf83-52f27b5b1560"
  
  - name: QUALYS_CLIENT_SECRET
    value: "BvWmg9uzaSqDChycKI2Me2YhH7mvxMrA"

steps:
  - bash: |
      set -euo pipefail

      mkdir -p "$(QSCANNER_OUTPUT_DIR)"

      cat > Dockerfile <<'EOF'
      FROM alpine:3.19
      RUN apk add --no-cache curl
      CMD ["sh", "-c", "echo Hello from QScanner test image"]
      EOF
    displayName: 'Prepare Test Files'

  - bash: |
      set -euo pipefail
      docker build -t "$IMAGE_ID" .
    displayName: 'Build Image'
    env:
      IMAGE_ID: $(IMAGE_ID)

  - bash: |
      set -euo pipefail

      if [ ! -x /usr/local/bin/qscanner ]; then
        echo "ERROR: QScanner is not installed or executable at /usr/local/bin/qscanner"
        exit 1
      fi

      if [ -z "${QUALYS_CLIENT_ID:-}" ]; then
        echo "ERROR: QUALYS_CLIENT_ID is not configured"
        exit 1
      fi

      if [ -z "${QUALYS_CLIENT_SECRET:-}" ]; then
        echo "ERROR: QUALYS_CLIENT_SECRET is not configured"
        exit 1
      fi

      mkdir -p "$QSCANNER_OUTPUT_DIR"

      /usr/local/bin/qscanner \
        --pod "$QSCANNER_QUALYS_POD" \
        --mode evaluate-policy \
        --policy-tags "$QSCANNER_POLICY_TAGS" \
        --scan-types pkg,fileinsight,aiinsight \
        --scan-timeout "$QSCANNER_SCAN_TIMEOUT" \
        --output-dir "$QSCANNER_OUTPUT_DIR" \
        image "$IMAGE_ID"
    displayName: 'Qualys Policy Gate'
    env:
      QUALYS_CLIENT_ID: $(QUALYS_CLIENT_ID)
      QUALYS_CLIENT_SECRET: $(QUALYS_CLIENT_SECRET)
      QSCANNER_QUALYS_POD: $(QSCANNER_QUALYS_POD)
      QSCANNER_POLICY_TAGS: $(QSCANNER_POLICY_TAGS)
      QSCANNER_SCAN_TIMEOUT: $(QSCANNER_SCAN_TIMEOUT)
      QSCANNER_OUTPUT_DIR: $(QSCANNER_OUTPUT_DIR)
      IMAGE_ID: $(IMAGE_ID)

  - task: PublishPipelineArtifact@1
    displayName: 'Publish Qualys Reports'
    condition: always()
    inputs:
      targetPath: '$(QSCANNER_OUTPUT_DIR)'
      artifact: 'qualys-reports'
      publishLocation: 'pipeline'
